function totals(id){let w=0,l=0,d=0;state.players.forEach(p=>{if(p.id!==id){const s=statsFor(id,p.id);w+=s[0];l+=s[1];d+=s[2]}});return{w,l,d,m:w+l+d,pts:w*3+d}}
function renderMatrix(){const ps=state.players,t=document.getElementById('matrix'),s=state.settings;let h='<thead><tr><th>'+esc(s.colId)+'</th>'+ps.map(p=>`<th>${esc(p.ef)}<br><span class="small muted">${esc(p.id)}</span></th>`).join('')+`<th>${esc(s.colWin)}</th><th>${esc(s.colLoss)}</th><th>${esc(s.colDraw)}</th><th>${esc(s.colMatches)}</th></tr></thead><tbody>`;ps.forEach(p=>{const x=totals(p.id);h+=`<tr><th>${esc(p.ef)}</th>`;ps.forEach(q=>{if(p.id===q.id)h+='<td class="dash">—</td>';else{const z=statsFor(p.id,q.id);h+=`<td class="cell"><span class="w">${z[0]}</span>-<span class="l">${z[1]}</span>-<span class="d">${z[2]}</span></td>`}});h+=`<td class="w"><b>${x.w}</b></td><td class="l"><b>${x.l}</b></td><td class="d"><b>${x.d}</b></td><td><b>${x.m}</b></td></tr>`});t.innerHTML=h+'</tbody>'}
function maskWA(v){v=String(v||'').replace(/\D/g,'');if(!v)return '';if(v.length<12)return v;return v.slice(0,3)+'***'+v.slice(6,9)+'**'+v.slice(-1)}
function maskTG(v){v=String(v||'');if(!v)return '-';return v.length<=7?v.slice(0,3)+'*****':v.slice(0,5)+'*****'}
function renderRanking(){const rows=state.players.map(p=>({...p,...totals(p.id)})).sort((a,b)=>b.pts-a.pts||b.w-a.w||a.l-b.l);const s=state.settings;document.getElementById('rankingTable').innerHTML='<thead><tr><th>'+esc(s.colRank)+'</th><th>'+esc(s.colPlayer)+'</th><th>'+esc(s.colWin)+'</th><th>'+esc(s.colLoss)+'</th><th>'+esc(s.colDraw)+'</th><th>'+esc(s.colMatches)+'</th><th>'+esc(s.colPoints)+'</th></tr></thead><tbody>'+rows.map((p,i)=>`<tr><td>${i+1}</td><th>${esc(p.ef)}</th><td class="w">${p.w}</td><td class="l">${p.l}</td><td class="d">${p.d}</td><td>${p.m}</td><td><b>${p.pts}</b></td></tr>`).join('')+'</tbody>'}
function renderPlayers(){const fallback='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"><circle cx="80" cy="80" r="76" fill="#062130" stroke="#14b8c4" stroke-width="4"/><circle cx="80" cy="62" r="25" fill="#8bd3e6"/><path d="M35 135c7-31 25-46 45-46s38 15 45 46" fill="#8bd3e6"/></svg>');document.getElementById('playerCards').innerHTML=state.players.map(p=>{const x=totals(p.id);const avatar=p.avatar||fallback;return `<div class="card profile" data-player="${escAttr(p.id)}"><div class="profileTop"><div><div class="muted small">eFootball ID</div><div class="big">${esc(p.ef)}</div></div><div class="avatarWrap"><img class="avatar" src="${escAttr(avatar)}" alt="Avatar ${escAttr(p.ef)}" onerror="this.onerror=null;this.src='${fallback}'"></div></div><div class="muted">Match ${x.m}</div><div><span class="w">W ${x.w}</span> · <span class="l">L ${x.l}</span> · <span class="d">D ${x.d}</span></div><div class="profileMeta"><div class="mini">WhatsApp<br><b>${esc(maskWA(p.wa))}</b></div><div class="mini">Telegram<br><b>${esc(maskTG(p.tg))}</b></div></div></div>`}).join('');document.querySelectorAll('.profile').forEach(c=>c.addEventListener('click',()=>openHistory(c.dataset.player)))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return esc(s)}
function openHistory(id){const p=player(id);if(!p)return;closeHistory();const opponents=state.players.filter(q=>q.id!==id&&state.matches.some(m=>(m.p1===id&&m.p2===q.id)||(m.p2===id&&m.p1===q.id)));let html='';opponents.forEach(o=>{const ms=state.matches.filter(m=>(m.p1===id&&m.p2===o.id)||(m.p2===id&&m.p1===o.id)).sort((a,b)=>a.id-b.id);html+=`<details class="matchGroup" open><summary>${esc(p.ef)} VS ${esc(o.ef)}</summary>`;ms.forEach(m=>{const s1=m.p1===id?m.s1:m.s2,s2=m.p1===id?m.s2:m.s1,o2=outcome(s1,s2);html+=`<div class="matchLine"><div>${esc(m.date)}</div><div><b>SCORE ${s1} VS ${s2}</b></div><div><span class="pill ${o2}">${o2==='win'?'WIN':o2==='loss'?'LOSE':'DRAW'}</span></div></div>`});html+='</details>'});if(!html)html='<div class="notice">Belum ada pertandingan.</div>';document.getElementById('modalTitle').textContent=`${p.ef} — ${state.settings.historyTitle}`;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.remove('hidden');document.body.style.overflow='hidden'}
function closeHistory(){document.getElementById('modal').classList.add('hidden');document.body.style.overflow=''}
function deletePlayer(id){const p=player(id);if(!confirm(`Hapus member ${p.ef}? Semua pertandingan member ini juga akan dihapus.`))return;state.players=state.players.filter(x=>x.id!==id);state.matches=state.matches.filter(m=>m.p1!==id&&m.p2!==id);save()}

function applyPublicSettings(){const s=state.settings;document.getElementById('siteTitle').textContent=s.title;document.getElementById('siteSubtitle').textContent=s.subtitle;document.getElementById('rankingTitle').textContent=s.rankingTitle;document.getElementById('rankingDesc').textContent=s.rankingDesc;document.getElementById('playersTitle').textContent=s.playersTitle;document.getElementById('liveBadge').textContent=s.live;document.getElementById('navRanking').textContent=s.navRanking;document.getElementById('navPlayers').textContent=s.navPlayers;document.getElementById('footerTitle').textContent=s.footerTitle;document.getElementById('footerText').textContent=s.footerText;document.title=s.title;document.getElementById('siteLogo').src=state.logo||'logo.png';document.getElementById('modalTitle').textContent=s.historyTitle;document.getElementById('closeModal').textContent=s.closeText;document.body.style.setProperty('--member-bg-desktop',state.memberBackgroundDesktop?`url("${state.memberBackgroundDesktop}")`:`url('stadium-bg.jpg')`);document.body.style.setProperty('--member-bg-mobile',state.memberBackgroundMobile?`url("${state.memberBackgroundMobile}")`:(state.memberBackgroundDesktop?`url("${state.memberBackgroundDesktop}")`:`url('stadium-bg.jpg')`))}
function renderAll(){applyPublicSettings();renderRanking();renderPlayers()}

document.querySelectorAll('.navbtn').forEach(btn=>btn.addEventListener('click',()=>{closeHistory();document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));document.getElementById(btn.dataset.tab).classList.remove('hidden')}));
document.getElementById('closeModal').addEventListener('click',closeHistory);document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeHistory()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeHistory()});
supabaseClient.channel('app-state-live').on('postgres_changes',{event:'UPDATE',schema:'public',table:'app_state',filter:'id=eq.1'},payload=>{if(normalizeRemote(payload.new)){renderAll()}}).subscribe();
renderAll();
</script></body></html>
